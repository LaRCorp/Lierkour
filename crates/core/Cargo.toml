[package]
name = "lierkour-core"
version = "2.3.0"
edition = "2024"
authors = ["LaRevole"]
license = "GPL-3.0-only"
description = "Core business logic, models, and database layer for Lierkour - Keeper of Completed Media"

[dependencies]
uuid = { version = "1", features = ["v4"] }
jni = { version = "0.21", optional = true }
anyhow = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
dirs = "7.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = [
    "gzip",
    "json",
    "rustls",
] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
android = ["dep:jni"]

